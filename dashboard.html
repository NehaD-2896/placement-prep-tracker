<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Placement Prep Tracker</title>
</head>
<body>
    <div class="container">
        <h1>DSA Progress Tracker</h1>
        
        <div class="input-section">
            <input type="text" id="topicInput" placeholder="Topic (e.g. Arrays)">
            <input type="number" id="countInput" placeholder="Problems Solved">
            <select id="statusInput">
                <option>Not Started</option>
                <option>In Progress</option>
                <option>Completed</option>
            </select>
            <button onclick="addTopic()">Add Topic</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Topic</th>
                    <th>Count</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="topicTableBody">
                </tbody>
        </table>
    </div>
    <script src="tracker.js"></script>
</body>
</html>
