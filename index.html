<!DOCTYPE html>
<html>
<head>
    <title>Placement Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Placement Prep Tracker</h1>

<!-- ADD ROLE -->
<input id="roleInput" placeholder="Role name">
<button onclick="addRole()">Add Role</button>

<ul id="roleList"></ul>

<hr>

<!-- APPLICATION -->
<h3>Add Application</h3>
<input id="roleIdApp" placeholder="Role ID">
<input id="company" placeholder="Company">
<input id="status" placeholder="Status">
<input id="date" type="date">
<button onclick="addApplication()">Add</button>

<hr>

<!-- DAILY PREP -->
<h3>Daily Prep</h3>
<input id="roleIdPrep" placeholder="Role ID">
<input id="prepDate" type="date">
<input id="dsa" placeholder="DSA solved">
<input id="subjects" placeholder="Subjects">
<input id="hours" placeholder="Hours">
<button onclick="addPrep()">Add</button>

<script src="script.js"></script>
</body>
</html>
