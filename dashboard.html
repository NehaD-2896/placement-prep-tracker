<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Placement Prep Tracker</title>
</head>
<body>
    <div class="container">
    <h1>Placement Role Tracker</h1>
    
    <div class="input-section">
        <input type="text" id="roleInput" placeholder="Job Role (e.g. SDE Intern)">
        <input type="text" id="companyInput" placeholder="Company (e.g. Amazon)">
        <button onclick="addRole()">Add Target Role</button>
    </div>

    <div id="rolesGrid" class="roles-grid">
        </div>
</div>
   

        <table>
            <thead>
                <tr>
                    <th>Topic</th>
                    <th>Count</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="topicTableBody">
                </tbody>
        </table>
    </div>
    <script src="tracker.js"></script>
</body>
</html>
