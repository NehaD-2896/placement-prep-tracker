<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrepPal — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0d0e11;
      --surface:   #16181e;
      --surface2:  #1e2029;
      --border:    #2a2d38;
      --accent:    #f5a623;
      --accent2:   #e8834a;
      --text:      #e8e9ef;
      --muted:     #6b7080;
      --success:   #4caf7d;
      --review:    #7c9ff5;
      --danger:    #e05c5c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
    }

    .page-wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 36px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,14,17,0.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 10;
      gap: 16px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: var(--muted);
      cursor: pointer; transition: color 0.2s;
      background: none; border: none; padding: 6px 10px;
      border-radius: 8px; font-family: 'DM Sans', sans-serif;
    }
    .back-btn:hover { color: var(--accent); background: rgba(245,166,35,0.08); }

    .header-divider { width: 1px; height: 20px; background: var(--border); }

    .role-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(245,166,35,0.1);
      border: 1px solid rgba(245,166,35,0.25);
      border-radius: 20px;
      padding: 4px 14px;
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .stat-chip strong { color: var(--text); font-weight: 500; }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 36px 80px;
      width: 100%;
      flex: 1;
      align-items: start;
    }

    /* ── ROLE HERO ── */
    .role-hero {
      margin-bottom: 28px;
    }
    .role-hero-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .role-hero h2 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .role-hero h2 .accent { color: var(--accent); }

    .progress-overview {
      display: flex; align-items: center; gap: 16px;
      margin-top: 14px;
    }
    .big-progress {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .big-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.5s ease;
    }
    .pct-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ── ADD ITEM BAR ── */
    .add-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }
    .add-bar-row { display: flex; gap: 10px; align-items: stretch; }
    .add-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-input::placeholder { color: var(--muted); }
    .add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }

    .type-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
      min-width: 130px;
    }
    .type-select:focus { border-color: var(--accent); }
    .type-select option { background: var(--surface2); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0d0e11; }
    .btn-primary:hover { box-shadow: 0 4px 18px rgba(245,166,35,0.3); }
    .btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

    /* ── FILTER TABS ── */
    .filter-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .filter-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .filter-tab.active {
      background: rgba(245,166,35,0.12);
      border-color: rgba(245,166,35,0.35);
      color: var(--accent);
    }
    .filter-count {
      display: inline-block;
      background: var(--surface2);
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 0.68rem;
      margin-left: 4px;
    }

    /* ── ITEMS LIST ── */
    .items-list { display: flex; flex-direction: column; gap: 10px; }

    .prep-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: all 0.2s;
      animation: itemIn 0.25s ease both;
      position: relative;
      overflow: hidden;
    }
    @keyframes itemIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .prep-item:hover {
      border-color: rgba(245,166,35,0.25);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .prep-item.status-done { opacity: 0.7; }
    .prep-item.status-done .item-title { text-decoration: line-through; color: var(--muted); }

    .item-check {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      transition: all 0.15s;
      background: transparent;
    }
    .item-check:hover { border-color: var(--success); }
    .item-check.checked { background: var(--success); border-color: var(--success); }
    .item-check.checked::after { content: '✓'; font-size: 12px; color: #0d0e11; font-weight: 700; }
    .item-check.review-check { border-color: var(--review); }
    .item-check.review-check.checked { background: var(--review); border-color: var(--review); }

    .item-body { flex: 1; min-width: 0; }

    .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

    .item-title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.4;
      transition: color 0.2s;
    }
    .item-title[contenteditable="true"] {
      outline: none;
      border-bottom: 1px dashed var(--accent);
    }

    .item-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .type-badge {
      font-size: 0.68rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .type-badge.question  { background: rgba(245,166,35,0.12); color: var(--accent); }
    .type-badge.topic     { background: rgba(76,175,125,0.12); color: var(--success); }
    .type-badge.note      { background: rgba(124,159,245,0.12); color: var(--review); }
    .type-badge.resource  { background: rgba(232,131,74,0.12); color: var(--accent2); }
    .type-badge.mock      { background: rgba(224,92,92,0.12); color: var(--danger); }

    .status-badge {
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge.pending { background: rgba(107,112,128,0.2); color: var(--muted); }
    .status-badge.done    { background: rgba(76,175,125,0.15); color: var(--success); }
    .status-badge.review  { background: rgba(124,159,245,0.15); color: var(--review); }

    .item-note {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
      font-style: italic;
    }

    .item-footer {
      display: flex; align-items: center; gap: 10px;
      margin-top: 10px;
    }
    .item-date { font-size: 0.72rem; color: var(--muted); }

    .item-actions { display: flex; gap: 6px; margin-left: auto; }
    .item-action-btn {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 0.75rem; padding: 4px 8px;
      border-radius: 6px; transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .item-action-btn:hover { background: var(--surface2); color: var(--text); }
    .item-action-btn.danger:hover { color: var(--danger); }

    .status-cycle {
      display: flex; gap: 4px;
    }
    .status-btn {
      padding: 3px 8px; border-radius: 4px;
      font-size: 0.68rem; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s; font-family: 'Syne', sans-serif;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .status-btn.s-pending { background: rgba(107,112,128,0.15); color: var(--muted); border-color: rgba(107,112,128,0.2); }
    .status-btn.s-pending.active, .status-btn.s-pending:hover { background: rgba(107,112,128,0.3); border-color: var(--muted); }
    .status-btn.s-review  { background: rgba(124,159,245,0.1);  color: var(--review);  border-color: rgba(124,159,245,0.2); }
    .status-btn.s-review.active, .status-btn.s-review:hover  { background: rgba(124,159,245,0.25); border-color: var(--review); }
    .status-btn.s-done    { background: rgba(76,175,125,0.1);   color: var(--success); border-color: rgba(76,175,125,0.2); }
    .status-btn.s-done.active, .status-btn.s-done:hover    { background: rgba(76,175,125,0.25); border-color: var(--success); }

    /* ── EMPTY LIST ── */
    .empty-items {
      text-align: center; padding: 56px 24px;
      color: var(--muted);
    }
    .empty-items .ei-icon { font-size: 2.8rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-items p { font-size: 0.88rem; line-height: 1.7; }

    /* ── SIDEBAR ── */
    .sidebar { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 18px; }

    .sidebar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .sidebar-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box {
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px;
    }
    .stat-val {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-val.gold { color: var(--accent); }
    .stat-val.green { color: var(--success); }
    .stat-val.blue { color: var(--review); }
    .stat-lbl { font-size: 0.72rem; color: var(--muted); }

    /* Type breakdown */
    .type-breakdown { display: flex; flex-direction: column; gap: 8px; }
    .type-row {
      display: flex; align-items: center; gap: 10px;
    }
    .type-row-label { font-size: 0.78rem; color: var(--muted); flex: 1; }
    .type-row-bar { flex: 2; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .type-row-fill { height: 100%; border-radius: 2px; }
    .type-row-count { font-size: 0.75rem; color: var(--text); font-weight: 500; min-width: 20px; text-align: right; }

    /* Activity */
    .activity-list { display: flex; flex-direction: column; gap: 8px; }
    .activity-item {
      display: flex; gap: 10px;
      font-size: 0.78rem; color: var(--muted);
      line-height: 1.4;
    }
    .activity-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0; margin-top: 5px;
    }

    /* Quick tips */
    .tip-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-item {
      font-size: 0.78rem; color: var(--muted); line-height: 1.5;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      border-left: 2px solid var(--accent);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.82rem;
      display: flex; align-items: center; gap: 8px;
      transform: translateY(60px); opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; padding: 20px; gap: 20px; }
      .sidebar { position: static; }
      header { padding: 14px 20px; }
      .stat-chip { display: none; }
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back
      </button>
      <div class="header-divider"></div>
      <div class="role-pill" id="headerRolePill">🎯 Loading…</div>
    </div>
    <div class="header-right">
      <div class="stat-chip"><strong id="hdrTotal">0</strong>&nbsp;items</div>
      <div class="stat-chip" style="color:var(--success)"><strong id="hdrDone">0</strong>&nbsp;done</div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- LEFT: Main -->
    <div class="main-col">

      <!-- ROLE HERO -->
      <div class="role-hero">
        <div class="role-hero-label">Prep Dashboard</div>
        <h2 id="roleTitle">Loading<span class="accent">…</span></h2>
        <div class="progress-overview">
          <div class="big-progress">
            <div class="big-progress-fill" id="bigProgress" style="width:0%"></div>
          </div>
          <div class="pct-label" id="pctLabel">0%</div>
        </div>
      </div>

      <!-- ADD ITEM -->
      <div class="add-bar">
        <div class="add-bar-row">
          <input type="text" class="add-input" id="newItemInput" placeholder="Add a topic, question, note, resource…" maxlength="200" autocomplete="off"/>
          <select class="type-select" id="newItemType">
            <option value="question">❓ Question</option>
            <option value="topic">📚 Topic</option>
            <option value="note">📝 Note</option>
            <option value="resource">🔗 Resource</option>
            <option value="mock">🎤 Mock</option>
          </select>
          <button class="btn btn-primary" onclick="addItem()">Add</button>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filter-row">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">All <span class="filter-count" id="fc-all">0</span></button>
        <button class="filter-tab" data-filter="pending" onclick="setFilter('pending', this)">Pending <span class="filter-count" id="fc-pending">0</span></button>
        <button class="filter-tab" data-filter="review" onclick="setFilter('review', this)">Review <span class="filter-count" id="fc-review">0</span></button>
        <button class="filter-tab" data-filter="done" onclick="setFilter('done', this)">Done <span class="filter-count" id="fc-done">0</span></button>
        <button class="filter-tab" style="margin-left:auto" data-filter="question" onclick="setFilter('question', this)">❓ <span class="filter-count" id="fc-question">0</span></button>
        <button class="filter-tab" data-filter="topic" onclick="setFilter('topic', this)">📚 <span class="filter-count" id="fc-topic">0</span></button>
        <button class="filter-tab" data-filter="mock" onclick="setFilter('mock', this)">🎤 <span class="filter-count" id="fc-mock">0</span></button>
      </div>

      <!-- ITEMS -->
      <div class="items-list" id="itemsList"></div>

    </div>

    <!-- RIGHT: Sidebar -->
    <aside class="sidebar">

      <!-- STATS -->
      <div class="sidebar-card">
        <div class="sidebar-card-title">Stats</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-val gold" id="st-total">0</div>
            <div class="stat-lbl">Total items</div>
          </div>
          <div class="stat-box">
            <div class="stat-val green" id="st-done">0</div>
            <div class="stat-lbl">Completed</div>
          </div>
          <div class="stat-box">
            <div class="stat-val blue" id="st-review">0</div>
            <div class="stat-lbl">In review</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="st-pct" style="color:var(--accent2)">0%</div>
            <div class="stat-lbl">Progress</div>
          </div>
        </div>
      </div>

      <!-- TYPE BREAKDOWN -->
      <div class="sidebar-card">
        <div class="sidebar-card-title">Breakdown by type</div>
        <div class="type-breakdown" id="typeBreakdown"></div>
      </div>

      <!-- RECENT ACTIVITY -->
      <div class="sidebar-card">
        <div class="sidebar-card-title">Recent activity</div>
        <div class="activity-list" id="activityList">
          <div style="font-size:0.78rem;color:var(--muted)">No activity yet.</div>
        </div>
      </div>

      <!-- TIPS -->
      <div class="sidebar-card">
        <div class="sidebar-card-title">Prep tips</div>
        <div class="tip-list" id="tipsList"></div>
      </div>

    </aside>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg">Saved!</span>
</div>

<script src="script.js"></script>
<script src="analytics.js"></script>
<script>
  // ── Helpers ──
  function escHtml(s) {
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return d.toLocaleDateString('en', { month:'short', day:'numeric' });
  }

  // ── State ──
  let roleId = null, role = null, currentFilter = 'all';
  const TIPS = [
    'Use "Mock" items to simulate real interview questions.',
    'Mark items as "Review" to revisit them before your interview.',
    'Adding resources keeps all prep materials in one place.',
    'Focus on completing your pending topics first.',
    'Try the STAR method for behavioral questions.',
  ];

  // ── Init ──
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    roleId = params.get('role');
    if (!roleId) { location.href = 'index.html'; return; }
    role = PrepData.getRole(roleId);
    if (!role) { location.href = 'index.html'; return; }

    PrepData.touchRole(roleId);
    analytics.trackPageView('dashboard', { roleId, roleName: role.name });
    analytics.startSession(roleId);

    document.title = `PrepPal — ${role.name}`;
    document.getElementById('headerRolePill').textContent = `🎯 ${role.name}`;
    document.getElementById('roleTitle').innerHTML = `${escHtml(role.name)}<span class="accent"> ›</span>`;

    renderItems();
    renderSidebar();
    renderTips();

    document.getElementById('newItemInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    window.addEventListener('beforeunload', () => analytics.endSession(roleId));
  });

  // ── Add item ──
  function addItem() {
    const input = document.getElementById('newItemInput');
    const type  = document.getElementById('newItemType').value;
    const title = input.value.trim();
    if (!title) { input.focus(); return; }
    const item = PrepData.addItem(roleId, { title, type });
    analytics.trackEvent('item_added', { roleId, type, title });
    analytics.logActivity(roleId, `Added ${type}: "${title}"`);
    input.value = '';
    input.focus();
    renderItems();
    renderSidebar();
    showToast(`${type.charAt(0).toUpperCase()+type.slice(1)} added`);
  }

  // ── Filter ──
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    renderItems();
  }

  // ── Render items ──
  function renderItems() {
    const items = PrepData.getItems(roleId);
    const TYPE_FILTERS = ['question','topic','note','resource','mock'];
    let filtered;
    if (TYPE_FILTERS.includes(currentFilter)) {
      filtered = items.filter(x => x.type === currentFilter);
    } else if (currentFilter === 'all') {
      filtered = [...items];
    } else {
      filtered = items.filter(x => x.status === currentFilter);
    }

    // Update filter counts
    document.getElementById('fc-all').textContent = items.length;
    document.getElementById('fc-pending').textContent = items.filter(x=>x.status==='pending').length;
    document.getElementById('fc-review').textContent  = items.filter(x=>x.status==='review').length;
    document.getElementById('fc-done').textContent    = items.filter(x=>x.status==='done').length;
    document.getElementById('fc-question').textContent = items.filter(x=>x.type==='question').length;
    document.getElementById('fc-topic').textContent    = items.filter(x=>x.type==='topic').length;
    document.getElementById('fc-mock').textContent     = items.filter(x=>x.type==='mock').length;

    // Progress
    const done = items.filter(x=>x.status==='done').length;
    const pct  = items.length ? Math.round(done/items.length*100) : 0;
    document.getElementById('bigProgress').style.width = pct + '%';
    document.getElementById('pctLabel').textContent = pct + '%';
    document.getElementById('hdrTotal').textContent = items.length;
    document.getElementById('hdrDone').textContent  = done;

    const list = document.getElementById('itemsList');
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-items">
        <div class="ei-icon">📭</div>
        <p>${items.length === 0 ? 'Add your first prep item above.' : 'Nothing matches this filter.'}</p>
      </div>`;
      return;
    }

    list.innerHTML = filtered.map((item, i) => `
      <div class="prep-item status-${item.status}" id="item-${item.id}" style="animation-delay:${i*0.04}s">
        <div class="item-check ${item.status==='done'?'checked':''} ${item.status==='review'?'review-check':''}"
             onclick="toggleDone('${item.id}')"></div>
        <div class="item-body">
          <div class="item-top">
            <div class="item-title" id="title-${item.id}">${escHtml(item.title)}</div>
            <div class="item-badges">
              <span class="type-badge ${item.type}">${item.type}</span>
              <span class="status-badge ${item.status}">${item.status}</span>
            </div>
          </div>
          ${item.note ? `<div class="item-note">${escHtml(item.note)}</div>` : ''}
          <div class="item-footer">
            <span class="item-date">${fmtDate(item.createdAt)}</span>
            <div class="item-actions">
              <div class="status-cycle">
                <button class="status-btn s-pending ${item.status==='pending'?'active':''}" onclick="setStatus('${item.id}','pending')">To-do</button>
                <button class="status-btn s-review  ${item.status==='review'?'active':''}"  onclick="setStatus('${item.id}','review')">Review</button>
                <button class="status-btn s-done    ${item.status==='done'?'active':''}"    onclick="setStatus('${item.id}','done')">Done</button>
              </div>
              <button class="item-action-btn" onclick="editNote('${item.id}')">✏ Note</button>
              <button class="item-action-btn danger" onclick="deleteItem('${item.id}')">✕</button>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  // ── Actions ──
  function toggleDone(id) {
    const item = PrepData.getItem(roleId, id);
    const next = item.status === 'done' ? 'pending' : 'done';
    PrepData.updateItem(roleId, id, { status: next });
    analytics.trackEvent('status_changed', { id, status: next });
    if (next === 'done') analytics.logActivity(roleId, `Completed: "${item.title}"`);
    renderItems(); renderSidebar();
  }

  function setStatus(id, status) {
    PrepData.updateItem(roleId, id, { status });
    analytics.trackEvent('status_changed', { id, status });
    renderItems(); renderSidebar();
  }

  function editNote(id) {
    const item = PrepData.getItem(roleId, id);
    const note = prompt('Add / edit note:', item.note || '');
    if (note === null) return;
    PrepData.updateItem(roleId, id, { note: note.trim() });
    analytics.logActivity(roleId, `Noted on: "${item.title}"`);
    renderItems(); renderSidebar();
  }

  function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    PrepData.deleteItem(roleId, id);
    renderItems(); renderSidebar();
    showToast('Item removed');
  }

  // ── Sidebar ──
  function renderSidebar() {
    const items = PrepData.getItems(roleId);
    const done   = items.filter(x=>x.status==='done').length;
    const review = items.filter(x=>x.status==='review').length;
    const pct    = items.length ? Math.round(done/items.length*100) : 0;

    document.getElementById('st-total').textContent  = items.length;
    document.getElementById('st-done').textContent   = done;
    document.getElementById('st-review').textContent = review;
    document.getElementById('st-pct').textContent    = pct + '%';

    // Type breakdown
    const types = ['question','topic','note','resource','mock'];
    const colors = { question:'#f5a623', topic:'#4caf7d', note:'#7c9ff5', resource:'#e8834a', mock:'#e05c5c' };
    const max = Math.max(...types.map(t=>items.filter(x=>x.type===t).length), 1);
    document.getElementById('typeBreakdown').innerHTML = types.map(t => {
      const cnt = items.filter(x=>x.type===t).length;
      return `<div class="type-row">
        <span class="type-row-label">${t}</span>
        <div class="type-row-bar"><div class="type-row-fill" style="width:${(cnt/max)*100}%;background:${colors[t]}"></div></div>
        <span class="type-row-count">${cnt}</span>
      </div>`;
    }).join('');

    // Activity
    const acts = analytics.getActivity(roleId).slice(-5).reverse();
    document.getElementById('activityList').innerHTML = acts.length
      ? acts.map(a=>`<div class="activity-item"><div class="activity-dot"></div><span>${escHtml(a.msg)} <em style="opacity:0.5">${fmtDate(a.ts)}</em></span></div>`).join('')
      : '<div style="font-size:0.78rem;color:var(--muted)">No activity yet.</div>';
  }

  function renderTips() {
    const shuffled = TIPS.sort(()=>Math.random()-0.5).slice(0,3);
    document.getElementById('tipsList').innerHTML = shuffled.map(t=>`<div class="tip-item">${t}</div>`).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2400);
  }
</script>

</body>
</html>
